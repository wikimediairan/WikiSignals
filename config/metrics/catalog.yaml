    by Wikistats. Not independently re-derived.
  source_endpoint: https://wikimedia.org/api/rest_v1/metrics/
- id: editors.active
  display_name: Active editors
  definition: 'Registered non-bot editors with five or more edits in the period (Wikimedia Research /
    Wikistats-aligned activity threshold).

    '
  methodology: 'Sum of AQS editors/aggregate for editor-type=user activity levels 5..24-edits, 25..99-edits,
    and 100..-edits. Page type all-page-types.

    '
  source: aqs
  unit: count
  intervals:
  - month
  module: editors
  status: stable
  sort_order: 20
  caveats: 'Includes redirects. Activity levels are period-scoped (monthly). Slight differences may exist
    versus dump-based Research definitions (archive tables, content-namespace filters).

    '
  privacy_notes: Aggregate count only; no individual editor lists.
  domain: capacity
  role: official_context
  metric_version: 1.0.0
  provenance_notes: Consumed from Wikimedia Analytics API (AQS), the same family of official metrics surfaced
    by Wikistats. Not independently re-derived.
  source_endpoint: https://wikimedia.org/api/rest_v1/metrics/
- id: editors.highly_active
  display_name: Highly active editors
  definition: Registered non-bot editors with 100 or more edits in the period.
  methodology: AQS editors/aggregate editor-type=user activity-level=100..-edits.
  source: aqs
  unit: count
  intervals:
  - month
  module: editors
  status: stable
  sort_order: 21
