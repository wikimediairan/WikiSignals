- id: admin.actions_total
  display_name: Administrative actions (total)
  definition: Sum of configured administrative log action families.
  methodology: Sum of admin.blocks, unblocks, protections, unprotections, deletions, undeletions, moves,
    rights_changes for the period.
  source: derived
  unit: count
  intervals:
  - month
  module: admin
  domain: admin
  role: derived
  status: experimental
  sort_order: 210
  metric_version: 1.0.0
  formula: sum(admin.* log families)
- id: admin.actions_per_active_editor
  display_name: Admin actions per active editor
  definition: Administrative actions divided by official active editors for the same period.
  methodology: admin.actions_total / editors.active (AQS).
  source: derived
  unit: ratio
  intervals:
  - month
  module: admin
  domain: admin
  role: derived
  status: experimental
  sort_order: 211
  metric_version: 1.0.0
  numerator: admin.actions_total
  denominator: editors.active
  formula: admin.actions_total / editors.active
- id: maintenance.open_total
  display_name: Maintenance backlog (configured tracks)
  definition: Sum of open item counts across enabled project maintenance tracks.
  methodology: Sum of categoryinfo sizes (or process open counts) for enabled maintenance_tracks in project
    health config.
  source: mediawiki
  unit: count
  intervals:
  - day
  - month
  module: maintenance
  domain: maintenance
  role: health
  status: stable
  sort_order: 300
  metric_version: 1.0.0
  caveats: Only configured tracks. Categories differ by wiki; not a universal quality score.
- id: maintenance.backlog_per_active_editor
  display_name: Maintenance backlog per active editor
  definition: Open configured maintenance items per active editor.
  methodology: maintenance.open_total / editors.active
  source: derived
  unit: ratio
  intervals:
  - month
  module: maintenance
  domain: maintenance
  role: derived
  status: stable
  sort_order: 301
  metric_version: 1.0.0
  numerator: maintenance.open_total
  denominator: editors.active
  formula: maintenance.open_total / editors.active
- id: automation.bot_edit_share
  display_name: Bot edit share
  definition: Share of edits performed by bots (group-bot + name-bot) among all edits.
  methodology: (edits.group_bot + edits.name_bot) / edits.total using official AQS series.
  source: derived
  unit: ratio
  intervals:
  - month
  module: automation
  domain: automation
  role: derived
  status: stable
  sort_order: 400
  metric_version: 1.0.0
  numerator: edits.group_bot + edits.name_bot
  denominator: edits.total
  formula: (edits.group_bot + edits.name_bot) / edits.total
  caveats: Describes dependence on automation, not bot quality. Do not infer causation with backlog changes.
- id: reverts.rate_official_denom
  display_name: Revert rate (vs human edits)
  definition: Reverted edits divided by human edits when both available.
  methodology: reverts.count / edits.user
  source: derived
  unit: ratio
  intervals:
  - month
  module: conflict
  domain: conflict
  role: derived
  status: unavailable_without_replicas
  sort_order: 250
