metrics:
- id: edits.total
  display_name: Total edits
  definition: All edits (all editor types) to all page types in the period.
  methodology: AQS edits/aggregate with editor-type=all-editor-types and page-type=all-page-types.
  source: aqs
  unit: count
  intervals:
  - day
  - month
  module: overview
  status: stable
  sort_order: 10
  caveats: Includes bot and anonymous edits. Redirect pages are included per AQS.
  privacy_notes: Aggregate count only.
  domain: context
  role: official_context
  metric_version: 1.0.0
  provenance_notes: Consumed from Wikimedia Analytics API (AQS), the same family of official metrics surfaced
    by Wikistats. Not independently re-derived.
  source_endpoint: https://wikimedia.org/api/rest_v1/metrics/
- id: edits.user
  display_name: Human (registered user) edits
  definition: Edits by registered users who are not classified as bots by AQS.
  methodology: AQS edits/aggregate editor-type=user.
  source: aqs
  unit: count
  intervals:
  - day
  - month
  module: editors
  status: stable
  sort_order: 11
  caveats: AQS user type excludes group-bot and name-bot; name-bot detection is heuristic.
  privacy_notes: Aggregate count only.
  domain: context
  role: official_context
  metric_version: 1.0.0
  provenance_notes: Consumed from Wikimedia Analytics API (AQS), the same family of official metrics surfaced
    by Wikistats. Not independently re-derived.
  source_endpoint: https://wikimedia.org/api/rest_v1/metrics/
- id: edits.group_bot
  display_name: Group-bot edits
  definition: Edits by accounts in bot user groups.
  methodology: AQS edits/aggregate editor-type=group-bot.
  source: aqs
  unit: count
  intervals:
  - day
  - month
  module: editors
  status: stable
  sort_order: 12
  domain: automation
  role: official_context
  metric_version: 1.0.0
  provenance_notes: Consumed from Wikimedia Analytics API (AQS), the same family of official metrics surfaced
    by Wikistats. Not independently re-derived.
  source_endpoint: https://wikimedia.org/api/rest_v1/metrics/
- id: edits.name_bot
  display_name: Name-bot edits
  definition: Edits by accounts matching bot naming patterns used by AQS.
  methodology: AQS edits/aggregate editor-type=name-bot.
  source: aqs
  unit: count
  intervals:
  - day
  - month
  module: editors
  status: stable
  sort_order: 13
  caveats: Name-bot classification is imperfect.
  domain: automation
  role: official_context
  metric_version: 1.0.0
  provenance_notes: Consumed from Wikimedia Analytics API (AQS), the same family of official metrics surfaced
