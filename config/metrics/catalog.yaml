- id: content.pages_deleted
  display_name: Page deletions
  definition: Delete log events in the period (page deletions).
  methodology: MediaWiki API list=logevents letype=delete aggregated by UTC day/month.
  source: mediawiki
  unit: count
  intervals:
  - day
  - month
  module: content
  status: experimental
  sort_order: 50
  caveats: Counts log events, not unique pages. Rate-limited API sampling may miss volume on huge wikis.
  domain: admin
  role: health
  metric_version: 1.0.0
  provenance_notes: Official Wikimedia Analytics (AQS) where source=aqs.
- id: moderation.blocks
  display_name: Blocks
