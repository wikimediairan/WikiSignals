  intervals:
  - day
  - month
  module: overview
  status: experimental
  sort_order: 51
  caveats: Includes blocks and unblocks depending on log filters; see methodology page.
  privacy_notes: Aggregate only; no target user lists in Observatory UI.
  domain: admin
  role: health
  metric_version: 1.0.0
  provenance_notes: Official Wikimedia Analytics (AQS) where source=aqs.
- id: reverts.count
  display_name: Reverted edits
  definition: Edits tagged as reverted (mw-reverted) where measurable.
  methodology: 'Prefer wiki replicas (change_tag). Fallback experimental sample via MediaWiki API is not
    used for stable reporting. Requires Toolforge replicas for accuracy.

    '
  source: replica
  unit: count
  intervals:
  - day
  - month
  module: reverts
  status: unavailable_without_replicas
  sort_order: 60
  caveats: Tag coverage varies by wiki and date. Community-health signal only.
  privacy_notes: Aggregate rates only; no individual user scoreboards.
  domain: conflict
  role: health
  metric_version: 1.0.0
  provenance_notes: Official Wikimedia Analytics (AQS) where source=aqs.
- id: reverts.rate
  display_name: Revert rate
  definition: Share of edits that were later reverted, where measurable.
  methodology: reverts.count / edits.user for the same period when both available.
  source: derived
  unit: ratio
  intervals:
  - month
  module: reverts
  status: unavailable_without_replicas
  sort_order: 61
  domain: conflict
  role: derived
  metric_version: 1.0.0
  provenance_notes: Official Wikimedia Analytics (AQS) where source=aqs.
